spring:
  application:
    name: distributor-retailer-management-system

  datasource:
    url: jdbc:mysql://localhost:3307/drms_db
    username: drms_user
    password: secret

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092